name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tests, lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check .
      - name: Typecheck with mypy
        run: mypy custom_components/sharing_is_caring
      - name: Run pytest
        run: pytest -v

  frontend:
    name: Frontend panel build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Ensure built bundle is committed and up to date
        run: git diff --exit-code custom_components/sharing_is_caring/frontend/
