name: Validate Marketplace & Hassfest

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master

  marketplace:
    name: Marketplace (HACS) validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run HACS / Marketplace validation
        uses: hacs/action@main
        with:
          category: integration
